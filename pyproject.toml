[project]
name = "vcfv"
version = "0.1.0"
description = "Fast VCF to Polars/Pandas DataFrame converter"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
keywords = ["vcf", "bioinformatics", "genomics", "polars", "pandas", "dataframe"]

classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13"
]

dependencies = [
    "polars>=1.0",
    "pyarrow>=14.0"
]

[project.optional-dependencies]
pandas    = ["pandas>=2.0"]
benchmark = ["scikit-allel", "psutil"]
dev       = ["pytest", "pytest-cov", "ruff", "mypy", "psutil"]

[project.urls]
Homepage   = "https://github.com/rvk20/vcfv"
Repository = "https://github.com/rvk20/vcfv"
Issues     = "https://github.com/rvk20/vcfv/issues"

[build-system]
requires      = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/vcfv"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"